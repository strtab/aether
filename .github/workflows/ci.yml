name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  update:
    name: Lock file update
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v14
        with:
          name: strtab-nixos-flake
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Flake update
        run: nix flake update --print-build-logs

      - name: Flake format check
        run: nix run nixpkgs#nixfmt-tree 

      - name: Commit changes
        uses: devops-infra/action-commit-push@v1.5.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "[CI] update lock file & formatting"
